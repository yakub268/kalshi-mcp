[project]
name = "prediction-market-mcp"
version = "0.2.0"
description = "Unified MCP server for prediction markets - Kalshi, Polymarket, and Metaculus. Search, analyze, compare, and trade across all major prediction platforms through Claude Desktop."
authors = [{name = "yakub268"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["mcp", "kalshi", "polymarket", "metaculus", "prediction-markets", "trading", "claude-desktop", "forecasting", "arbitrage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/yakub268/kalshi-mcp"
Repository = "https://github.com/yakub268/kalshi-mcp"
Issues = "https://github.com/yakub268/kalshi-mcp/issues"

[tool.mcp]
name = "io.github.yakub268/prediction-markets"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
